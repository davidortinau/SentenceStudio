<!DOCTYPE html>
<html lang="en" data-bs-theme="light" data-ss-theme="seoul-pop">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Coach click repro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <!-- The REAL shipped stylesheet -->
  <link rel="stylesheet" href="./app.css" />
</head>
<body>

<!-- Mirrors MainLayout.razor nesting exactly:
     A = .d-flex.flex-column.vh-100
       EnvironmentBadge
       B = .d-flex.flex-row.flex-grow-1.overflow-hidden
         nav.sidebar-nav
         C (contains <main>)
         offcanvas
         ToastContainer
         CoachWorkspaceHost  -> the .modal lives HERE
-->
<div id="layout-a" class="d-flex flex-column vh-100">
  <div id="env-badge">env</div>
  <div id="layout-b" class="d-flex flex-row flex-grow-1 overflow-hidden">
    <nav id="sidebar" class="d-none d-md-flex flex-column flex-shrink-0 sidebar-nav">
      <button id="sidebar-btn" class="btn btn-sm">sidebar</button>
    </nav>
    <div id="layout-c" class="d-flex flex-column flex-grow-1 overflow-hidden">
      <main class="flex-grow-1 overflow-auto p-3 main-content">
        <button id="page-btn" class="btn btn-ss-primary">page button</button>
      </main>
    </div>
    <div class="toast-container-ss"></div>

    <!-- CoachDialog.razor output -->
    <div class="modal fade coach-modal" id="coachWorkspace" tabindex="-1"
         role="dialog" aria-modal="true" aria-labelledby="coach-title">
      <div class="modal-dialog coach-dialog modal-dialog-centered">
        <div class="modal-content">

          <!-- CoachWorkspaceOverlay.razor output -->
          <div class="coach-workspace">
            <div class="coach-workspace-inner">
              <div class="coach-header">
                <h2 id="coach-title" tabindex="-1" class="flex-grow-1">Learning Coach</h2>
                <span class="coach-status-chip">Nothing changed yet</span>
                <button id="plan-toggle" type="button" class="btn btn-ss-secondary coach-action"
                        aria-expanded="false" aria-controls="coach-canvas">Plan</button>
                <button id="coach-close" type="button" class="btn btn-sm btn-icon coach-action"
                        aria-label="Close"><i class="bi bi-x-lg"></i></button>
              </div>

              <div class="coach-body">
                <div class="coach-chat-column">
                  <div class="coach-messages">
                    <div class="coach-chip-row" role="group" aria-label="Quick constraints">
                      <button id="chip-10" type="button" class="coach-chip" aria-pressed="false">10 min</button>
                    </div>
                  </div>
                  <div class="coach-composer-wrap">
                    <div class="d-flex align-items-end gap-2">
                      <div class="flex-grow-1">
                        <textarea id="coach-composer" class="form-control" rows="1"
                                  data-enter-sends="true" placeholder="What is today like?"></textarea>
                      </div>
                      <button id="coach-send" type="button" class="btn btn-ss-primary coach-action"
                              aria-label="Send"><i class="bi bi-send"></i></button>
                    </div>
                    <div id="coach-composer-counter" class="d-flex justify-content-between mt-1">
                      <span id="counter" class="coach-input-counter">0 / 500</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

<div id="results" style="position:fixed;bottom:0;left:0;z-index:99999;background:#fff;font:12px monospace;padding:4px;"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
  // The REAL shipped interop
  import { openCoachModal, closeCoachModal, disposeCoachModal, getViewportWidth, bindComposerEnter }
      from './app.js';

  const log = [];
  window.__log = log;
  const record = name => { log.push(name); document.getElementById('results').textContent = log.join(','); };

  // Stand-in for the Blazor DotNetObjectReference
  const dotNetRef = { invokeMethodAsync(m) { record('dotnet:' + m); return Promise.resolve(); } };
  window.__ref = dotNetRef;

  for (const id of ['sidebar-btn', 'page-btn', 'plan-toggle', 'coach-close', 'chip-10', 'coach-send']) {
    document.getElementById(id).addEventListener('click', () => record('click:' + id));
  }
  document.getElementById('coach-composer')
      .addEventListener('input', e => {
        record('input');
        document.getElementById('counter').textContent = e.target.value.length + ' / 500';
      });

  bindComposerEnter('coach-composer', dotNetRef);

  window.__open = () => openCoachModal('coachWorkspace', dotNetRef);
  window.__close = () => closeCoachModal('coachWorkspace');
  window.__dispose = () => disposeCoachModal('coachWorkspace');
  window.__viewport = getViewportWidth;

  // Probe: what element actually receives a click at a point?
  window.__topmostAt = (x, y) => {
    const el = document.elementFromPoint(x, y);
    return el ? (el.id || el.className || el.tagName) : 'none';
  };
  window.__inertChain = id => {
    const out = [];
    let n = document.getElementById(id);
    while (n && n !== document.body) { out.push((n.id || n.className || n.tagName) + (n.hasAttribute('inert') ? '[INERT]' : '')); n = n.parentElement; }
    return out.join(' < ');
  };
</script>
</body>
</html>
