name: Squad Issue Assign

on:
  push:
  pull_request:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue to assign after automated triage
        required: true
        type: string

concurrency:
  group: squad-issue-assign-${{ github.event.issue.number || inputs.issue_number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  policy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 #v4
      - name: Check Squad policy and mutations
        run: |
          node .github/skills/squad/scripts/check-policy.js
          node --test .github/skills/squad/scripts/*.test.js

  assign-work:
    needs: policy-check
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && startsWith(github.event.label.name, 'squad:'))
    permissions:
      issues: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 #v4

      - name: Identify assigned member and trigger work
        id: route
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b #v7
        with:
          script: |
            const fs = require('fs');
            const dispatched = context.eventName === 'workflow_dispatch';
            if (dispatched || context.payload.label?.name?.toLowerCase() === 'squad:copilot') {
              throw new Error('Squad @copilot issue assignment blocked: GitHub cannot enforce gpt-6-sol, max reasoning effort, and long_context together');
            }
            const issueNumber = context.payload.issue.number;
            if (!Number.isSafeInteger(issueNumber) || issueNumber < 1) {
              throw new Error('Invalid issue_number for Squad assignment');
            }
            const issue = context.payload.issue;
            if (issue.state !== 'open' || issue.pull_request) {
              core.info('Issue is closed or is a pull request; no assignment');
              return;
            }
            const label = context.payload.label.name;
            if (!issue.labels.some(l => l.name === label)) {
              core.info(`Issue #${issueNumber} no longer has ${label}; no assignment`);
              return;
            }

            // Match the slug used by sync-squad-labels (e.g., Fact Checker → fact-checker).
            const memberName = label.replace('squad:', '').toLowerCase();
            const slugify = name => name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

            const teamFile = '.squad/team.md';
            if (!fs.existsSync(teamFile)) {
              core.warning('No .squad/team.md found — cannot assign work');
              return;
            }

            const content = fs.readFileSync(teamFile, 'utf8');
            const lines = content.split('\n');

            let assignedMember = null;
            let inMembersTable = false;
            for (const line of lines) {
              if (line.match(/^##\s+(Members|Team Roster)/i)) {
                inMembersTable = true;
                continue;
              }
              if (inMembersTable && line.startsWith('## ')) {
                break;
              }
              if (inMembersTable && line.startsWith('|') && !line.includes('---') && !line.includes('Name')) {
                const cells = line.split('|').map(c => c.trim()).filter(Boolean);
                if (cells.length >= 2 && slugify(cells[0]) === memberName) {
                  assignedMember = { name: cells[0], role: cells[1] };
                  break;
                }
              }
            }

            if (!assignedMember) {
              core.warning(`No member found matching label "${label}"`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `⚠️ No squad member found matching label \`${label}\`. Check \`.squad/team.md\` for valid member names.`
              });
              return;
            }

            const comment = [
              `### 📋 Assigned to ${assignedMember.name} (${assignedMember.role})`,
              '',
              `**Issue:** #${issue.number} — ${issue.title}`,
              '',
              `${assignedMember.name} will pick this up in the next Squad session.`,
              '',
              `> To reassign, swap the \`squad:*\` label.`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: comment
            });

            core.info(`Issue #${issue.number} routed to ${assignedMember.name} (${assignedMember.role})`);

      - name: Assign @copilot coding agent
        # Kept as a policy-checked request shape; never run without a supported effort/context interface.
        if: ${{ false }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b #v7
        with:
          github-token: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
          script: |
            throw new Error('Squad @copilot issue assignment blocked: max reasoning effort and long_context cannot be enforced');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.eventName === 'workflow_dispatch'
              ? Number(context.payload.inputs.issue_number)
              : context.payload.issue.number;
            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number });
            if (issue.state !== 'open' || !issue.labels.some(l => l.name === 'squad:copilot')) {
              core.info(`Issue #${issue_number} is closed or no longer routed to Copilot`);
              return;
            }
            if (issue.assignees.some(a => a.login === 'copilot-swe-agent[bot]')) {
              core.info(`Issue #${issue_number} already has Copilot assigned`);
              return;
            }

            // Get the default branch name (main, master, etc.)
            const { data: repoData } = await github.rest.repos.get({ owner, repo });
            const baseBranch = repoData.default_branch;

            await github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/assignees', {
              owner,
              repo,
              issue_number,
              assignees: ['copilot-swe-agent[bot]'],
              agent_assignment: {
                target_repo: `${owner}/${repo}`,
                base_branch: baseBranch,
                custom_instructions: '',
                custom_agent: '',
                model: 'gpt-6-sol'
              },
              headers: {
                'X-GitHub-Api-Version': '2022-11-28'
              }
            });
            const { data: assigned } = await github.rest.issues.get({ owner, repo, issue_number });
            if (!assigned.assignees.some(a => a.login === 'copilot-swe-agent[bot]')) {
              throw new Error(`Copilot was not assigned to issue #${issue_number}; no model-free retry`);
            }
            core.info(`Assigned copilot-swe-agent to issue #${issue_number} with gpt-6-sol (base: ${baseBranch})`);
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: `Routed to @copilot with explicit GPT model gpt-6-sol. Review the resulting draft PR.`
            });
