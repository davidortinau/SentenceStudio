name: Squad Triage

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    if: github.event.label.name == 'squad'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 #v4

      - name: Check Squad policy
        run: node .github/skills/squad/scripts/check-policy.js

      - name: Triage issue via Lead agent
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b #v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { parseRoster, parseRoutingRules, parseModuleOwnership, triageIssue, requireAssignable, requireNoCopilotLabel } =
              require(path.join(process.env.GITHUB_WORKSPACE || process.cwd(), '.squad', 'templates', 'ralph-triage.js'));
            const issue = context.payload.issue;

            const teamFile = '.squad/team.md';
            if (!fs.existsSync(teamFile)) {
              core.warning('No .squad/team.md found — cannot triage');
              return;
            }

            const content = fs.readFileSync(teamFile, 'utf8');

            // Issue assignment cannot enforce all three Squad model settings.
            const hasCopilot = content.includes('| @copilot |');
            if (content.includes('<!-- copilot-auto-assign: true -->')) {
              throw new Error('Squad @copilot auto-assignment is blocked: max reasoning effort and long_context cannot be enforced');
            }
            requireNoCopilotLabel(issue);

            const members = parseRoster(content);

            const routingFile = '.squad/routing.md';
            if (!fs.existsSync(routingFile)) {
              throw new Error('No .squad/routing.md found — cannot triage');
            }
            const routingContent = fs.readFileSync(routingFile, 'utf8');

            // Find the Lead
            const lead = members.find(m =>
              m.role.toLowerCase().includes('lead') ||
              m.role.toLowerCase().includes('architect') ||
              m.role.toLowerCase().includes('coordinator')
            );

            if (!lead) {
              core.warning('No Lead role found in team roster — cannot triage');
              return;
            }

            // Build triage context
            const memberList = members.map(m =>
              `- **${m.name}** (${m.role}) → label: \`${m.label}\``
            ).join('\n');

            // Determine best assignee based on issue content and routing
            const decision = triageIssue(issue, parseRoutingRules(routingContent),
              parseModuleOwnership(routingContent), members);
            if (!decision) {
              throw new Error('No Squad member available for issue triage');
            }
            requireAssignable(decision);
            const assignedMember = decision.agent;
            const triageReason = decision.reason;
            const assignLabel = assignedMember.label;

            // Add the member-specific label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: [assignLabel]
            });

            // Apply default triage verdict
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: ['go:needs-research']
            });

            // Post triage comment
            const comment = [
              `### 🏗️ Squad Triage — ${lead.name} (${lead.role})`,
              '',
              `**Issue:** #${issue.number} — ${issue.title}`,
              `**Assigned to:** ${assignedMember.name} (${assignedMember.role})`,
              `**Reason:** ${triageReason}`,
              hasCopilot ? '**@copilot assignment:** Blocked until model, max reasoning effort, and long_context can all be enforced.' : '',
              '',
              `---`,
              '',
              `**Team roster:**`,
              memberList,
              '',
              `> To reassign, remove the current \`squad:*\` label and add the correct one.`,
            ].filter(Boolean).join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: comment
            });

            core.info(`Triaged issue #${issue.number} → ${assignedMember.name} (${assignLabel})`);
