# Inline-class companion (InlineClass = true): TextAlign.Center returns int.
-keep class androidx.compose.ui.text.style.TextAlign$Companion {
    public int getCenter-e0LSkKk();
}

# Offset.Unbox: pointer and layout offsets returned to C#.
-keep class androidx.compose.ui.geometry.Offset {
