# Activity toasts (SnackbarHostState.ShowSnackbarAsync): the binding reads the
# SnackbarDuration enum constants by name (GetStaticFieldID) and maps the
# SnackbarResult by its enum name. R8 removed the SnackbarDuration fields; the
# facade ships keep rules only for showSnackbar itself.
-keep class androidx.compose.material3.SnackbarDuration {
    public static final androidx.compose.material3.SnackbarDuration Short;
    public static final androidx.compose.material3.SnackbarDuration Long;
    public static final androidx.compose.material3.SnackbarDuration Indefinite;
}
-keepnames class androidx.compose.material3.SnackbarResult
-keepclassmembers enum androidx.compose.material3.SnackbarResult {
    public static final androidx.compose.material3.SnackbarResult Dismissed;
    public static final androidx.compose.material3.SnackbarResult ActionPerformed;
}

