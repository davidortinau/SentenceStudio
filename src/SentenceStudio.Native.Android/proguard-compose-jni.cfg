# App-level R8 keep rules for Microsoft.AndroidX.Compose 0.1.0-foundation.999911b.1.
# The facade resolves these members by name and descriptor through raw JNI
# (JNIEnv.GetMethodID/GetStaticMethodID), but its shipped .pro files do not keep
# them. Without a rule R8 removes the member or rewrites its descriptor, and the
# lookup throws NoSuchMethodError at runtime. Remove an entry once the facade
# ships the equivalent rule.

# TextFieldValueBridges.NewTextFieldValueImpl: every text field state. R8 kept
# only <init>(int, long, String), so Release crashed at startup.
-keep,includedescriptorclasses class androidx.compose.ui.text.input.TextFieldValue {
    <init>(java.lang.String, long, androidx.compose.ui.text.TextRange, int, kotlin.jvm.internal.DefaultConstructorMarker);
}

# ThemeBridges.InvokeColorSchemeDefault (48 colors, 2 masks, marker): the app's
# MaterialTheme light and dark schemes. R8 shortened the light descriptor and
# removed the dark one.
-keep,includedescriptorclasses class androidx.compose.material3.ColorSchemeKt {
    public static androidx.compose.material3.ColorScheme lightColorScheme-_VG5OTI$default(long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, int, int, java.lang.Object);
    public static androidx.compose.material3.ColorScheme darkColorScheme-_VG5OTI$default(long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, long, int, int, java.lang.Object);
}

# SuspendBridges.AndroidUiDispatcherMain: Compose suspend calls such as
# ScrollState.ScrollToAsync. R8 removed the getter.
-keep,includedescriptorclasses class androidx.compose.ui.platform.AndroidUiDispatcher$Companion {
    public kotlin.coroutines.CoroutineContext getMain();
}

# KotlinResult.CreateFailure: LaunchedEffect resumes with a failure when its C#
# body throws or is cancelled. R8 narrowed the return type to Result$Failure.
-keep,includedescriptorclasses class kotlin.ResultKt {
    public static java.lang.Object createFailure(java.lang.Throwable);
}

